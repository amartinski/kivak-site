<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ativar sua conta — KIVAK</title>
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css" />
  <style>
    body { background: linear-gradient(160deg, #0d2b1f 0%, #16382a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .ativar-card { max-width: 420px; width: 100%; }
    .ativar-logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; }
    .step { display: none; }
    .step.active { display: block; }
    .success-icon { font-size: 2.6rem; text-align: center; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="ativar-card">
  <div class="ativar-logo">
    <svg viewBox="0 0 728 170" width="150" height="35" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd">
      <path d="M480.421,7.007l-14.233,-6.898l7.764,20.427l-52.531,97.971l-19.548,36.813l-18.372,-13.313l7.737,27.585l176.472,0l9.892,-26.585l-17.959,12.313l-22.721,-40.813l-50.788,-93.933l9.286,-20.465l-14.998,6.898Zm0,108.5l16.26,39.813l-30.76,0.187l14.5,-40Zm-6.429,-68.903l-0.48,52.143l-24.435,56.573l-32.144,0.388l57.059,-109.104Zm12.116,0l58.437,108.716l-30.571,0l-27.431,-56.813l-0.434,-51.903Z" style="fill:none;stroke:#1D9E75;stroke-width:5px;"/>
      <path d="M189.69,0.059l-13.519,48.897l-1.259,120.637l27.755,0l0.031,-120.972l-13.008,-48.562Z" style="fill:none;stroke:#fff;stroke-width:5px;"/>
      <path d="M697.456,0.109l-64.035,68.898l0,34.5l8,-8l55.965,74.085l30.5,0l-66.965,-93.085l66.965,-76.398l-30.43,0Zm-103.946,0l-1.592,169.484l27.411,0l-0.586,-169.484l-25.233,0Zm-198.589,-0.102l-44.695,46.597l-22.805,58.403l13,37.5l54.5,-142.5Zm-151.5,0.102l63.24,169.484l28.518,-0l-46.147,-122.988l-45.611,-46.495Zm-143.955,0l-57.045,68.898l0,34.5l8,-8l53.072,74.085l35.572,0l-69.145,-92.085l0,-4.5l58.217,-72.898l-28.672,0Zm-99.453,-0l-0,169.484l26.5,0l0.407,-169.484l-26.907,-0Z" style="fill:none;stroke:#fff;stroke-width:5px;"/>
    </svg>
  </div>

  <div class="form-card">
    <!-- Etapa 1: código -->
    <div class="step active" id="step-codigo">
      <h3>Ativar sua conta</h3>
      <p class="form-sub">Digite o código de 8 dígitos que mandamos pro seu e-mail.</p>
      <form id="form-codigo" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="codigo">Código de 8 dígitos</label>
          <input type="text" id="codigo" name="codigo" required maxlength="8" pattern="[0-9]{8}" style="text-align:center;letter-spacing:.3em;font-weight:700" placeholder="00000000" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verificar código →</button>
        <div class="form-msg"></div>
      </form>
    </div>

    <!-- Etapa 2: nova senha -->
    <div class="step" id="step-senha">
      <h3>Crie sua senha</h3>
      <p class="form-sub">Mínimo 8 caracteres, com 1 letra maiúscula e 1 número.</p>
      <form id="form-senha" novalidate>
        <div class="field">
          <label for="senha">Nova senha</label>
          <input type="password" id="senha" name="senha" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar senha e ativar →</button>
        <div class="form-msg"></div>
      </form>
    </div>

    <!-- Etapa 3: sucesso -->
    <div class="step" id="step-sucesso">
      <div class="success-icon">🎉</div>
      <h3 style="text-align:center">Sua conta está pronta!</h3>
      <p class="form-sub" style="text-align:center">Baixe o app abaixo e faça login com seu e-mail e a senha que você acabou de criar.</p>
      <a class="btn btn-primary btn-block" id="link-download" href="#">📲 Baixar o KIVAK (Android)</a>
    </div>
  </div>
</div>

<script>
  // TODO: apontar pro APK hospedado de verdade (ex: media.kivak.app/kivak.apk)
  // assim que decidirem onde ele vai ficar publicamente.
  const APK_DOWNLOAD_URL = 'assets/kivak.apk';

  const API_BASE = 'https://api.kivak.app/api/v2';
  const params = new URLSearchParams(window.location.search);
  const emailParam = params.get('email');
  if (emailParam) document.getElementById('email').value = emailParam;

  let tokenRedefinicao = '';

  function mostrarEtapa(id) {
    document.querySelectorAll('.step').forEach((s) => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function setMsg(form, texto, tipo) {
    const msg = form.querySelector('.form-msg');
    msg.textContent = texto;
    msg.className = `form-msg ${tipo}`;
  }

  // A API pode responder com { erro: "texto" } ou, quando é erro de
  // validação (zod), { erro: { fieldErrors: {...}, formErrors: [...] } } —
  // sem tratar os dois casos, o segundo virava "[object Object]" na tela.
  function mensagemDeErro(data, padrao) {
    if (typeof data?.erro === 'string') return data.erro;
    const doCampo = Object.values(data?.erro?.fieldErrors ?? {}).flat();
    if (doCampo.length > 0) return doCampo[0];
    if (data?.erro?.formErrors?.length > 0) return data.erro.formErrors[0];
    return padrao;
  }

  document.getElementById('form-codigo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Verificando...';
    try {
      const res = await fetch(`${API_BASE}/auth/verificar-codigo`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: form.email.value.trim(), codigo: form.codigo.value.trim() }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(mensagemDeErro(data, 'Código inválido'));
      tokenRedefinicao = data.token;
      mostrarEtapa('step-senha');
    } catch (err) {
      setMsg(form, typeof err.message === 'string' ? err.message : 'Código inválido ou expirado.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verificar código →';
    }
  });

  document.getElementById('form-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button');
    const senha = form.senha.value;
    if (senha.length < 8 || !/[A-Z]/.test(senha) || !/[0-9]/.test(senha)) {
      setMsg(form, 'A senha precisa de 8+ caracteres, 1 letra maiúscula e 1 número.', 'err');
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Criando...';
    try {
      const res = await fetch(`${API_BASE}/auth/redefinir-senha`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: tokenRedefinicao, novaSenha: senha }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(mensagemDeErro(data, 'Não foi possível criar a senha'));
      document.getElementById('link-download').href = APK_DOWNLOAD_URL;
      mostrarEtapa('step-sucesso');
    } catch (err) {
      setMsg(form, typeof err.message === 'string' ? err.message : 'Sessão expirada, peça um novo código.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Criar senha e ativar →';
    }
  });
</script>
</body>
</html>
