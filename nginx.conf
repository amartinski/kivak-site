server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Atrás do Cloudflare Tunnel o nginx escuta na 8080 — redirect absoluto
  # (ex.: /blog → /blog/) sairia como http://kivak.app:8080/blog/.
  absolute_redirect off;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  # script-src precisa de 'unsafe-inline' por causa do <script> embutido em
  # ativar.html (fluxo de ativação de conta) — mover pra um .js separado
  # deixaria isso mais estrito, mas não é feito por essa auditoria.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.kivak.app" always;

  location / {
    # 404 de verdade: devolver a home com 200 pra qualquer URL faz o Google
    # tratar como soft 404 e derruba a avaliação do site.
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.kivak.app" always;
  }
}
