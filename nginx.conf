server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Atrás do Cloudflare Tunnel o nginx escuta na 8080; com redirect absoluto,
  # /blog viraria http://kivak.app:8080/blog/.
  absolute_redirect off;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  # script-src precisa de 'unsafe-inline' por causa do <script> embutido em
  # ativar.html (fluxo de ativação de conta); mover pra um .js separado
  # deixaria isso mais estrito, mas não é feito por essa auditoria.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.kivak.app; media-src 'self' https://media.kivak.app; frame-src https://www.youtube-nocookie.com" always;

  # Serviço do blog (blog-server.mjs, container "blog" do mesmo compose). O
  # resolver do Docker com variável evita que o nginx deixe de subir se o
  # container do blog ainda não existir.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /blog {
    set $blog http://blog:3002;
    proxy_pass $blog;
    proxy_set_header Host $host;
  }

  # Home e sitemap também passam pelo blog (posts recentes / URLs dos posts);
  # se ele estiver fora, entra a versão estática gerada pelo build.mjs.
  location = / {
    set $blog http://blog:3002;
    proxy_pass $blog;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 502 503 504 = @estatico;
  }

  location = /sitemap.xml {
    set $blog http://blog:3002;
    proxy_pass $blog;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 502 503 504 = @estatico;
  }

  location @estatico {
    try_files $uri /index.html =404;
  }

  location / {
    # 404 de verdade: devolver a home com 200 pra qualquer URL faz o Google
    # tratar como soft 404 e derruba a avaliação do site.
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.kivak.app; media-src 'self' https://media.kivak.app; frame-src https://www.youtube-nocookie.com" always;
  }
}
